# data-app/nginx-spa.conf
# Sert les fichiers statiques Vite.
# Les routes inconnues renvoient vers index.html (React Router côté client).

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Assets versionnés (hash dans le nom) : cache long
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Toute route non trouvée → index.html (SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
